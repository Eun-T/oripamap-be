#driver=com.mysql.cj.jdbc.Driver
#url=jdbc:mysql://127.0.0.1:3306/scoula_db
jdbc.driver=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
jdbc.url=${DB_URL:jdbc:log4jdbc:mysql://localhost:3306/oripa}
jdbc.username=${DB_USERNAME:root}
jdbc.password=${DB_PASSWORD:mysql}

# JWT
jwt.secret=${JWT_SECRET}
jwt.cookie.secure=${JWT_COOKIE_SECURE:false}

# OAuth state cookie (set OAUTH_STATE_COOKIE_SECURE=true in HTTPS production)
oauth.state-cookie.secure=${OAUTH_STATE_COOKIE_SECURE:false}

# Kakao OAuth
kakao.rest-api-key=${KAKAO_REST_API_KEY:}
kakao.client-secret=${KAKAO_CLIENT_SECRET:}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost/api/auth/kakao/callback}
frontend.redirect-uri=${FRONTEND_REDIRECT_URI:http://localhost:5173}

# aws s3
aws.s3.bucket=oripa-images-dev
aws.s3.region=ap-southeast-2

# Naver OAuth
naver.client-id=${NAVER_CLIENT_ID:}
naver.client-secret=${NAVER_CLIENT_SECRET:}
naver.redirect-uri=${NAVER_REDIRECT_URI:http://localhost/api/auth/naver/callback}

# Resend email verification
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:}

csrf.cookie-domain=${CSRF_COOKIE_DOMAIN:}
